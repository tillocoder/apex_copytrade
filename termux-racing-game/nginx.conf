# ==============================================================================
# Nginx Reverse Proxy Configuration for Apex Speed 3D Racing Server
# Compatible with SSL (Let's Encrypt / Cloudflare) and WebSocket upgrades
# ==============================================================================

# Variant A: Subdomain orqali ishlatish (Masalan: race.sizningdomeningiz.uz)
server {
    listen 80;
    server_name race.yourdomain.com;

    # HTTPS ga redirect (agar SSL bo'lsa)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5050;
        
        # WebSocket Upgrade headerlari (Multiplayer real-time uchun shart)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standart proxy headerlari
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeoutlari (uzilib qolmasligi uchun)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Variant B: Mavjud domen ichida alohida port yoki path orqali (Masalan: port 5050 to'g'ridan-to'g'ri)
# Termux ichida Cloudflare Tunnel ishlatilsa:
# cloudflared tunnel --url http://localhost:5050
