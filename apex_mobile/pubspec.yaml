name: apex_mobile
description: "Apex CopyTrade & Institutional AI Trading Terminal - Flutter Mobile & Tablet Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Networking & WebSockets
  http: ^1.2.1
  web_socket_channel: ^2.4.5
  dio: ^5.4.3+1
  
  # UI & Charts
  fl_chart: ^0.68.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.252.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  
  # Local Storage & Preferences
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true