version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://apex:apexsecret@postgres:5432/apex_quant
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apexsecret
      POSTGRES_DB: apex_quant
    ports:
      - "5432:5432"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    command: celery -A tasks worker --loglevel=info
    depends_on:
      - redis
      - backend
